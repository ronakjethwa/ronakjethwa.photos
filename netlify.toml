[build]
    # Directory (relative to root of your repo) that contains the deploy-ready HTML files
    publish = "_site"

    # Build command
    command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com; style-src 'self' 'unsafe-inline';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Configure a11y plugin with increased timeout for minified HTML
[[plugins]]
  package = "netlify-plugin-a11y"
  [plugins.inputs]
    # Increase timeout from default 30s to 60s for minified HTML parsing
    timeout = 60000
