[build]
    # Directory (relative to root of your repo) that contains the deploy-ready HTML files
    publish = "_site"

    # Build command
    command = "npm run build"

[build.environment]
    NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com; style-src 'self' 'unsafe-inline';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML must revalidate, or a deploy never reaches anyone who has already visited.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprinted image variants never change, so cache them hard.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Titles changed during the 2026 gallery refresh -- keep the old URLs alive
[[redirects]]
  from = "/gallery/north-cascades-national-park-washington"
  to = "/gallery/mount-baker-highway-washington"
  status = 301
  force = true

[[redirects]]
  from = "/gallery/gloomyrainy-pike-place-market-seattle"
  to = "/gallery/public-market-seattle"
  status = 301
  force = true

[[redirects]]
  from = "/gallery/bar-harbor-maine"
  to = "/gallery/thunder-hole-acadia-national-park"
  status = 301
  force = true

# Persist the generated image variants between builds.
#
# @11ty/eleventy-img skips work when the output file already exists, so a warm
# build is ~3s against ~280s cold. Netlify starts from an empty _site, which
# meant regenerating all 564 variants on every deploy -- including deploys that
# only changed a lockfile. That was saturating the build queue.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["_site/images"]

# The sitemap plugin is installed from the Netlify UI; these inputs configure it.
# Without them it lists /404 (which is noindex) and emits slash-less URLs that
# every one of which 301s to the real page.
[[plugins]]
  package = "@netlify/plugin-sitemap"
  [plugins.inputs]
    # Paths are relative to the repo root, not URLs: the plugin turns each into a
    # globby negative against `_site/**/**.html`, so "/404.html" matched nothing.
    exclude = ["_site/404.html"]
    trailingSlash = true
